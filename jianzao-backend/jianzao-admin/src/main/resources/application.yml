# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  # undertow 配置
  undertow:
    # HTTP post内容的最大大小。当值为-1时，默认值为大小是无限的
    max-http-post-size: 20MB
    # 以下的配置会影响buffer,这些buffer会用于服务器连接的IO操作,有点类似netty的池化内存管理
    # 每块buffer的空间大小,越小的空间被利用越充分
    buffer-size: 512
    # 是否分配的直接内存
    direct-buffers: true
    threads:
      # 设置IO线程数, 它主要执行非阻塞的任务,它们会负责多个连接, 默认设置每个CPU核心一个线程
      io: 8
      # 阻塞任务线程池, 当执行类似servlet请求阻塞操作, undertow会从这个线程池中取得线程,它的值设置取决于系统的负载
      worker: 256

captcha:
  # 是否启用验证码校验
  # 默认关闭：登录页的滑块组件依赖第三方 tac SDK（/public/tac），该 SDK 未随本仓库分发。
  # 开启前需自备已授权的 SDK 放入 jianzao-erp/public/tac/，再设为 true；
  # 登录接口本身有 @RateLimiter（20 次/分钟/IP）兜底。
  enable: false
  # 验证码类型 math 数组计算 char 字符验证
  type: math
  # 数字验证码位数
  numberLength: 1
  # 字符验证码长度
  charLength: 4

# 日志配置
logging:
  level:
    org.dromara: @logging.level@
    org.springframework: warn
    org.mybatis.spring.mapper: error
    org.apache.fury: warn
  config: classpath:logback-plus.xml

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  application:
    name: jianzao-backend
  threads:
    # 开启虚拟线程 仅jdk21可用
    virtual:
      enabled: false
  task:
    execution:
      # 从 springboot 3.5 开始 spring自带线程池
      # 不再需要 AsyncConfig与ThreadPoolConfig 可直接注入线程池使用
      thread-name-prefix: async-
      # 由spring自己初始化线程池
      mode: force
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: @profiles.active@
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  mvc:
    # 设置静态资源路径 防止所有请求都去查静态资源
    static-path-pattern: /static/**
    format:
      date-time: yyyy-MM-dd HH:mm:ss
  jackson:
    # 日期格式化
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      # 格式化输出
      indent_output: false
      # 忽略无法转换的对象
      fail_on_empty_beans: false
    deserialization:
      # 允许对象忽略json中不存在的属性
      fail_on_unknown_properties: false

# Sa-Token配置
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: Authorization
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: false
  # jwt秘钥：默认值仅供本地开发/测试，生产与 Windows 单机包必须通过 SA_TOKEN_JWT_SECRET_KEY 覆盖
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY:dev-only-jwt-secret-change-me-0123456789abcdef}

# security配置
security:
  # 跨域白名单，多个用英文逗号分隔；留空表示不放开跨域（前后端同源部署无需配置），禁止填写 *
  cors:
    allowed-origins: ${SECURITY_CORS_ALLOWED_ORIGINS:}
  # 排除路径
  excludes:
    - /*.html
    - /**/*.html
    - /**/*.css
    - /**/*.js
    - /favicon.ico
    - /error
    - /*/api-docs
    - /*/api-docs/**

# 多租户配置
tenant:
  # 是否开启
  enable: true
  # 排除表
  excludes:
    - sys_menu
    - sys_tenant
    - sys_tenant_package
    - sys_role_dept
    - sys_role_menu
    - sys_user_post
    - sys_user_role
    - sys_client
    - sys_oss_config
    - flow_spel

# MyBatisPlus配置
# https://baomidou.com/config/
mybatis-plus:
  # 自定义配置 是否全局开启逻辑删除 关闭后 所有逻辑删除功能将失效
  enableLogicDelete: true
  # 多包名使用 例如 org.dromara.**.mapper,org.xxx.**.mapper
  mapperPackage: org.dromara.**.mapper,org.erp.**.mapper
  # 对应的 XML 文件位置
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: org.dromara.**.domain,org.erp.**.domain
  global-config:
    dbConfig:
      # 主键类型
      # AUTO 自增 NONE 空 INPUT 用户输入 ASSIGN_ID 雪花 ASSIGN_UUID 唯一 UUID
      # 如需改为自增 需要将数据库表全部设置为自增
      idType: ASSIGN_ID

# 数据加密
mybatis-encryptor:
  # 是否开启加密
  enable: false
  # 默认加密算法
  algorithm: BASE64
  # 编码方式 BASE64/HEX。默认BASE64
  encode: BASE64
  # 安全秘钥 对称算法的秘钥 如：AES，SM4
  password:
  # 公私钥 非对称算法的公私钥 如：SM2，RSA
  publicKey:
  privateKey:

# api 接口加密
# 默认关闭：本地开发与 Docker Compose 均按前端 VITE_APP_ENCRYPT=false 运行，传输安全依赖 HTTPS。
# 如需开启（同时加密请求体与响应体）：
#   1) 生成 1024 位密钥对：
#        openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:1024 -out private.pem
#        openssl rsa -in private.pem -pubout -out public.pem
#   2) 去掉 PEM 头尾与换行，把 Base64 单行文本填入下面的 publicKey / privateKey
#   3) 前端 .env 填同一对密钥，并设 VITE_APP_ENCRYPT=true
# 注意：只配一边时，带 @ApiEncrypt 的接口（如 /login）会被 CryptoFilter 直接返回 403。
api-decrypt:
  enabled: false
  # AES 加密头标识
  headerFlag: encrypt-key
  # 响应加密公钥（Base64，不含 PEM 头尾）
  publicKey: ''
  # 请求解密私钥（Base64，不含 PEM 头尾）
  privateKey: ''

springdoc:
  api-docs:
    # 是否开启接口文档
    enabled: true
  info:
    # 标题
    title: '简造ERP社区版_接口文档'
    # 描述
    description: '五金机加简造ERP社区版后台服务接口文档'
    # 版本
    version: '版本号: ${project.version}'
    # 作者信息
    contact:
      name: Fawkes
      email: fawkes@example.com
      url: https://github.com/Fawkes-hub/jianzao-erp-community
  #这里定义了两个分组，可定义多个，也可以不定义
  group-configs:
    - group: 1.通用模块
      packages-to-scan: org.dromara.web
    - group: 2.系统模块
      packages-to-scan: org.dromara.system
    - group: 3.代码生成模块
      packages-to-scan: org.dromara.generator

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接
  # 说明：打印模板接口的 content 字段存放 HTML+Thymeleaf 模板，
  #      经 XSS 清洗会剥除全部 th:* 动态绑定，导致保存的模板渲染为空壳，故排除。
  #      必须带 /** 覆盖子路径：编辑保存走 PUT /erp/print/templates/{id}，
  #      仅写 /erp/print/templates 只能匹配新建（POST），编辑仍会被清洗。
  excludeUrls:
    - /system/notice
    - /erp/print/templates
    - /erp/print/templates/**
    - /erp/print/preview

--- # 分布式锁 lock4j 全局配置
lock4j:
  # 获取分布式锁超时时间，默认为 3000 毫秒
  acquire-timeout: 3000
  # 分布式锁的超时时间，默认为 30 秒
  expire: 30000

--- # Actuator 监控端点的配置项
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: ALWAYS
    logfile:
      external-file: ./logs/sys-console.log

--- # 默认/推荐使用sse推送
sse:
  enabled: true
  path: /resource/sse

--- # websocket
websocket:
  # 如果关闭 需要和前端开关一起关闭
  enabled: false
  # 路径
  path: /resource/websocket
  # 设置访问源地址
  allowedOrigins: '*'

--- # warm-flow 工作流配置已裁剪：jianzao-workflow 依赖已从 pom 移除，无需要配置项
